databases:
  - name: assistencia-db
    plan: free
    databaseName: assistencia

services:
  - type: web
    name: assistencia-tecnica-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: assistencia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: assistencia-tecnica
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://assistencia-tecnica-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html