# Todas as credenciais vêm de variáveis de ambiente (nada de senha no código).
# DB_PASSWORD e SECRET_KEY são obrigatórias: sem elas a aplicação não sobe.
server.port=${PORT:8080}

# Mesmo banco PostgreSQL do backend Python. Formato JDBC: jdbc:postgresql://host:5432/banco
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistencia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# O schema pertence ao backend Python / database/01_schema.sql: o Java nunca o altera.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Mesmo segredo usado pelo FastAPI para assinar o JWT (HS256).
app.secret-key=${SECRET_KEY}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
