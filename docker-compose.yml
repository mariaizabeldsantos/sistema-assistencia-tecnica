services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assistencia
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # cria as tabelas a partir do script SQL na primeira vez que o banco sobe
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/assistencia
      SECRET_KEY: troque-esta-chave-por-uma-bem-aleatoria
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Módulo de Estoque em Java / Spring Boot (usa o mesmo banco e o mesmo SECRET_KEY do backend)
  estoque:
    build: ./estoque-java
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/assistencia
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: troque-esta-chave-por-uma-bem-aleatoria
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_ESTOQUE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - estoque

volumes:
  db_data:
